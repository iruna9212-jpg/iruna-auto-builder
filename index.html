<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イルーナ オートビルダー</title>

<style>
body{
  font-family:sans-serif;
  background:#222;
  color:white;
  text-align:center;
}

input{
  width:80%;
  padding:12px;
  font-size:16px;
}

button{
  padding:12px 30px;
  margin:10px;
  font-size:16px;
  border-radius:10px;
}

.card{
  background:#333;
  margin:10px;
  padding:15px;
  border-radius:10px;
}
</style>

</head>

<body>

<h1>イルーナ オートビルダー</h1>

<h2>🔍 装備検索</h2>

<input id="search" placeholder="装備名を入力">

<br>

<button onclick="searchEquip()">検索</button>

<div id="result"></div>


<script>

let equips = [];

// equip.jsonを読み込む
fetch("equip.json")
.then(response => response.json())
.then(data => {
    equips = data;
})
.catch(error => {
    document.getElementById("result").innerHTML =
    "データ読み込みエラー";
});


// 検索
function searchEquip(){

let word =
document.getElementById("search").value;

let result =
document.getElementById("result");


let found =
equips.filter(e =>
e.name.includes(word)
);


if(found.length > 0){

result.innerHTML="";

found.forEach(e=>{

result.innerHTML += `

<div class="card">

<h3>${e.name}</h3>

種類：${e.type}<br>

ATK：${e.atk}<br>

MATK：${e.matk}<br>

効果：${e.effect}

</div>

`;

});

}else{

result.innerHTML="見つかりませんでした";

}

}

</script>


</body>
</html>
